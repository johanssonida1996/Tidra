# Publicerar testversionen på GitHub Pages vid varje push till main (eller manuellt under Actions).
# Bara själva appen publiceras – inte tester, README eller package.json.
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Datalager, export, exempelföretag och kontraster – inget publiceras om något test fallerar
      - name: Kör testerna
        run: npm test

      - name: Samla appens filer
        run: |
          mkdir _site
          cp -r index.html manifest.json assets css js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
